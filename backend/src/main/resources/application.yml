spring:
  application:
    name: office-runner-backend
  config:
    # อ่านค่าจากไฟล์ .env ที่โฟลเดอร์ project (ถ้ามี)
    import: optional:file:.env[.properties]
  datasource:
    # ใช้ Session pooler ของ Supabase (Project > Connect > Session pooler) เช่น
    # jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      data-source-properties:
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

app:
  jwt:
    # ต้องตั้ง JWT_SECRET ใน .env (อย่างน้อย 32 ตัวอักษร) ไม่มีค่าเริ่มต้น
    secret: ${JWT_SECRET}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  max-tip: 1000
  max-topup: 10000
