spring:
  application:
    name: office-runner-backend
  config:
    # อ่านค่าจากไฟล์ .env ที่โฟลเดอร์ project (ถ้ามี)
    import: optional:file:.env[.properties]
  datasource:
    # ใช้ Session pooler ของ Supabase (Project > Connect > Session pooler) เช่น
    # jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      data-source-properties:
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

app:
  supabase:
    # https://<project-ref>.supabase.co
    url: ${SUPABASE_URL}
    # ว่างไว้ = ตรวจ JWT ด้วย JWKS (asymmetric keys, ค่าเริ่มต้นของโปรเจกต์ใหม่)
    # ใส่ค่า = ตรวจด้วย Legacy JWT secret (HS256)
    jwt-secret: ${SUPABASE_JWT_SECRET:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  max-tip: 1000
  max-topup: 10000
